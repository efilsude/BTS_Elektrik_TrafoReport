name: trafo_report_mobile
description: B.T.S. Elektrik Trafo Bakım ve Test Saha Raporlama Sistemi Mobil Uygulaması

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2


  # Local Database, Security, Backup, and Utilities
  sqflite: ^2.4.1
  bcrypt: ^1.1.3
  archive: ^3.6.1
  file_picker: ^8.1.4
  crypto: ^3.0.6
  path: ^1.9.0
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.1
  http: ^1.2.0

  # Camera, Scanning, Files, and Permissions
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.2
  path_provider: ^2.1.5
  open_filex: ^4.5.0
  share_plus: ^10.1.2
  permission_handler: ^11.3.1

  # UI and Design Elements
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
